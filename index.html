<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>92款商品资料</title><style>body{margin:0;font:16px system-ui;background:#faf8f3;color:#29251f}#login{max-width:440px;margin:12vh auto;padding:24px}input,button{font:inherit;padding:12px;margin:6px 0}input{width:90%}button{background:#70432d;color:white;border:0;cursor:pointer}iframe{width:100%;height:100vh;border:0;display:none}#err{color:#a32929}</style><div id="login"><h1>92款商品资料</h1><p>请输入访问密码。</p><form id="form"><input id="password" type="password" autocomplete="current-password" required><br><button>打开资料</button></form><p id="err" role="alert"></p></div><iframe id="view" title="商品资料"></iframe><script>
const salt=Uint8Array.from(atob('5h9NcKWybrMcpgIYIdpZMA=='),c=>c.charCodeAt(0));let key,manifest,cache=new Map();const view=document.querySelector('#view');
async function decrypt(bytes){let b=new Uint8Array(bytes);return await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12))}
async function load(path){if(cache.has(path))return cache.get(path);if(!manifest[path])throw Error('找不到文件: '+path);let r=await fetch('data/'+manifest[path]);if(!r.ok)throw Error('读取文件失败');let raw=await decrypt(await r.arrayBuffer());cache.set(path,raw);return raw}
function resolve(base,url){let u=new URL(url,'https://local.invalid/'+base);return u.origin==='https://local.invalid'?decodeURIComponent(u.pathname.slice(1)):null}
async function show(path){let html=new TextDecoder().decode(await load(path));let doc=new DOMParser().parseFromString(html,'text/html');let imgs=[...doc.querySelectorAll('img[src]')];await Promise.all(imgs.map(async img=>{let target=resolve(path,img.getAttribute('src'));if(target&&manifest[target]){let bytes=await load(target);let type=target.toLowerCase().endsWith('.png')?'image/png':'image/jpeg';img.src=URL.createObjectURL(new Blob([bytes],{type}));}}));for(let a of doc.querySelectorAll('a[href]')){let href=a.getAttribute('href'),target=resolve(path,href);if(target&&manifest[target]){if(/\.(jpg|jpeg|png)$/i.test(target)){let img=[...imgs].find(i=>resolve(path,i.getAttribute('data-original')||'')===target);let bytes=await load(target);a.href=URL.createObjectURL(new Blob([bytes],{type:target.endsWith('.png')?'image/png':'image/jpeg'}));}else {a.href='#';a.dataset.target=target;}}}view.onload=()=>{let d=view.contentDocument;d.addEventListener('click',e=>{let a=e.target.closest('a[data-target]');if(a){e.preventDefault();show(a.dataset.target).catch(fail)}})};view.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;}
function fail(e){document.querySelector('#err').textContent=e.message||'无法打开资料，请重试。'}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();document.querySelector('#err').textContent='正在解锁…';try{let material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('#password').value),'PBKDF2',false,['deriveKey']);key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);let r=await fetch('manifest.bin');if(!r.ok)throw Error('资料加载失败');manifest=JSON.parse(new TextDecoder().decode(await decrypt(await r.arrayBuffer())));await show('index.html');document.querySelector('#login').style.display='none';view.style.display='block';}catch(e){document.querySelector('#err').textContent='密码错误或资料加载失败，请重试。';}});
</script></html>
